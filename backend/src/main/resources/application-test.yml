spring:
  config:
    import: optional:file:env/.env.test.properties
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:test-placeholder}
      chat:
        options:
          model: gpt-4o-mini

management:
  health:
    redis:
      enabled: false
    elasticsearch:
      enabled: false
  endpoint:
    health:
      show-details: never

rate-limit:
  auth-per-minute: 10000
  api-per-minute: 100000
