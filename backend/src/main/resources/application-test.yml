spring:
  config:
    import: optional:file:env/.env.test.properties
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=value
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:test-placeholder}
      chat:
        options:
          model: gpt-4o-mini

management:
  health:
    redis:
      enabled: false
    elasticsearch:
      enabled: false
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized

rate-limit:
  auth-per-minute: 10000
  api-per-minute: 100000
